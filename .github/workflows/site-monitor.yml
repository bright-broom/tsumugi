# 公開後の監視（#32、ADR 0046）。リポジトリ変数 SITE_URL（例: https://<本番ドメイン>）が
# 未設定ならコードの自社公開判断に一致する DOMAIN を監視する。どちらもなければ失敗する。
# 失敗（FAIL）はジョブの失敗になり、GitHub の標準の通知（Actions の失敗通知）で知らせる。
name: Site monitor
on:
  schedule:
    - cron: '17 * * * *' # 毎時 17 分（UTC）。混み合う毎時 0 分を避ける
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Monitor
        run: npm run monitor
      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-monitor-${{ github.run_number }}
          path: .artifacts/ops/monitor.json
          retention-days: 14
          if-no-files-found: warn
