# 毎週のバックアップと復元テスト（#31、ADR 0045）。
# Public リポジトリの成果物は誰でも取得できるため、既に公開されているリポジトリの内容だけを保管する。
# CMS や問い合わせのデータ、秘密情報をここに入れてはいけない。
name: Weekly backup
on:
  schedule:
    - cron: '23 18 * * 0' # 毎週月曜 3:23（日本時間）
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - name: Create backup
        id: backup
        run: npm run backup -- --out "$RUNNER_TEMP/backup"
      - name: Restore test
        env:
          BACKUP_DIR: ${{ steps.backup.outputs.dir }}
        run: npm run backup:restore-test -- --backup "$BACKUP_DIR" --work "$RUNNER_TEMP/restore" --deps ci --build build
      - name: Summary
        if: always() && steps.backup.outputs.dir != ''
        env:
          BACKUP_DIR: ${{ steps.backup.outputs.dir }}
        run: |
          {
            echo "### Weekly backup"
            echo
            echo "- バックアップ: $(basename "$BACKUP_DIR")"
            if [ -f "$BACKUP_DIR/restore-report.json" ]; then
              node -e 'const r=require(process.argv[1]);console.log(`- 復元テスト: ${r.ok?"成功":"失敗"}（合計 ${(r.totalMs/1000).toFixed(1)} 秒）`);for(const s of r.steps)console.log(`  - ${s.ok?"OK":"FAIL"} ${s.name}: ${(s.ms/1000).toFixed(1)} 秒`)' "$BACKUP_DIR/restore-report.json"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload backup
        if: always() && steps.backup.outputs.dir != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tsumugi-backup-${{ github.run_number }}
          path: ${{ steps.backup.outputs.dir }}
          retention-days: 90
          if-no-files-found: error
